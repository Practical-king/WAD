<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>College Admin Dashboard</title>

<!-- Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- Sidebar -->
<div class="col-md-2 sidebar">

<h4 class="text-center mb-4">🎓 College</h4>

<a href="#"><i class="bi bi-house"></i> Dashboard</a>
<a href="#"><i class="bi bi-people"></i> Students</a>
<a href="#"><i class="bi bi-person-badge"></i> Faculty</a>
<a href="#"><i class="bi bi-book"></i> Courses</a>
<a href="#"><i class="bi bi-bar-chart"></i> Results</a>
<a href="#"><i class="bi bi-gear"></i> Settings</a>

</div>

<!-- Main Content -->
<div class="col-md-10 main">

<!-- Navbar -->
<div class="topbar mb-4">
<h4>College Admin Dashboard</h4>
<div class="admin">+
<span>Admin</span>
</div>
</div>

<!-- Statistics Cards -->
<div class="row g-4">

<div class="col-md-3">
<div class="card dashboard-card blue">
<i class="bi bi-people-fill"></i>
<h6>Total Students</h6>
<h3>1500</h3>
</div>
</div>

<div class="col-md-3">
<div class="card dashboard-card green">
<i class="bi bi-person-workspace"></i>
<h6>Faculty</h6>
<h3>120</h3>
</div>
</div>

<div class="col-md-3">
<div class="card dashboard-card orange">
<i class="bi bi-book-fill"></i>
<h6>Courses</h6>
<h3>45</h3>
</div>
</div>

<div class="col-md-3">
<div class="card dashboard-card purple">
<i class="bi bi-award-fill"></i>
<h6>Pass Percentage</h6>
<h3>92%</h3>
</div>
</div>

</div>

<!-- Table Section -->
<div class="table-box mt-5">

<h5>Recent Activities</h5>

<table class="table table-hover">
<thead>
<tr>
<th>Student</th>
<th>Course</th>
<th>Status</th>
</tr>
</thead>

<tbody>
<tr>
<td>Rahul Sharma</td>
<td>BCA</td>
<td><span class="badge bg-success">Passed</span></td>
</tr>

<tr>
<td>Priya Patel</td>
<td>BBA</td>
<td><span class="badge bg-warning text-dark">Pending</span></td>
</tr>

<tr>
<td>Amit Verma</td>
<td>MCA</td>
<td><span class="badge bg-primary">Ongoing</span></td>
</tr>

</tbody>

</table>

</div>

</div>
</div>
</div>

</body>
</html>
