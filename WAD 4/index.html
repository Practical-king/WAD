<!DOCTYPE html>
<html>
<head>

    <title>jQuery Mobile Website</title>

    <!-- jQuery Mobile CSS -->
    <link rel="stylesheet"
    href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

    <!-- jQuery Mobile JS -->
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

</head>

<body>

    <!-- Page -->
    <div data-role="page" id="home">

        <!-- Header -->
        <div data-role="header">
            <h1>My Mobile Website</h1>
        </div>

        <!-- Navigation Bar -->
        <div data-role="navbar">
            <ul>
                <li><a href="#home" class="ui-btn-active">Home</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </div>

        <!-- Content -->
        <div data-role="content">

            <h2>Welcome</h2>

            <p>This is a simple mobile website using jQuery Mobile.</p>

            <!-- Button -->
            <a href="#" class="ui-btn ui-btn-b ui-corner-all">
                Click Me
            </a>

            <br>

            <!-- Form -->
            <form>

                <label>Name:</label>
                <input type="text" placeholder="Enter Name">

                <label>Email:</label>
                <input type="email" placeholder="Enter Email">

                <input type="submit" value="Submit">

            </form>

        </div>

        <!-- Footer -->
        <div data-role="footer">
            <h4>WAD Practical</h4>
        </div>

    </div>

    <!-- About Page -->
    <div data-role="page" id="about">

        <div data-role="header">
            <h1>About Page</h1>
        </div>

        <div data-role="content">
            <p>This is About Page.</p>

            <a href="#home" class="ui-btn">
                Go Back
            </a>
        </div>

    </div>

</body>
</html>
